<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ultima chat demo</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background: #101418; color: #dde3ea; margin: 2rem; }
  h1 { font-size: 1.3rem; }
  #status { display: inline-block; padding: .15rem .6rem; border-radius: 1rem; font-size: .8rem; background: #555; }
  #status.open { background: #1f7a3d; }
  #status.reconnecting, #status.connecting { background: #8a6d1a; }
  #status.closed { background: #8a1a1a; }
  #layout { display: flex; gap: 1.5rem; margin-top: 1rem; }
  #log { flex: 1; border: 1px solid #2a323b; border-radius: .3rem; padding: .6rem; height: 24rem; overflow-y: auto; background: #141a20; }
  #log .line { margin: .15rem 0; white-space: pre-wrap; word-break: break-word; }
  #log .who { color: #7db3e8; }
  #log .sys { color: #9aa7b4; font-style: italic; }
  #side { width: 12rem; }
  #side h2 { font-size: .95rem; margin: 0 0 .4rem; }
  #online { list-style: none; margin: 0; padding: 0; }
  #online li { padding: .1rem 0; }
  input { font: inherit; background: #1a2129; color: inherit; border: 1px solid #2a323b; border-radius: .3rem; padding: .3rem .5rem; }
  button { font: inherit; background: #26415c; color: inherit; border: 1px solid #3a5a7c; border-radius: .3rem; padding: .3rem .8rem; cursor: pointer; }
  #composer { display: flex; gap: .5rem; margin-top: .6rem; }
  #text { flex: 1; }
  #note { color: #9aa7b4; font-size: .85rem; min-height: 1.2em; }
</style>
</head>
<body>
<h1>Ultima chat — chat:lobby</h1>
<p><span id="status">connecting</span> <span id="note"></span></p>
<div id="layout">
  <div>
    <div id="log"></div>
    <div id="composer">
      <input id="text" placeholder="message — try !ping or !time" autocomplete="off">
      <button id="send">send</button>
    </div>
  </div>
  <div id="side">
    <h2>online</h2>
    <ul id="online"></ul>
  </div>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
