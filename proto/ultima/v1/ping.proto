syntax = "proto3";

package ultima.v1;

option go_package = "github.com/pschlump/ultima/gen/go/ultima/v1;ultimav1";

// Ultima is the binary command surface (design doc §6.2). M0 ships only the
// Ping health-check RPC; the typed Command envelope arrives with M4.
service Ultima {
  rpc Ping(PingRequest) returns (PingResponse);
}

message PingRequest {
  // Optional payload, echoed back in the response. Empty behaves like a
  // bare RESP PING.
  string message = 1;
}

message PingResponse {
  // Echo of PingRequest.message, or "PONG" when the request carried none.
  string message = 1;
}
