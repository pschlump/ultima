version: "2"

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
  exclusions:
    paths:
      - gen/
      - note/
      - docs/
      - lib/resp/ # vendored redcon fork: kept close to upstream
      - third_party/ # vendored ergochat/readline fork: kept close to upstream

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - gen/
      - note/
      - docs/
      - lib/resp/
      - third_party/

run:
  timeout: 5m
